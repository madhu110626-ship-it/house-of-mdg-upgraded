<header class="inner-header">
  <a href="index.html"><img src="logo.PNG" class="logo" alt="MDG Logo"></a>
  <nav>
    <a href="index.html">HOME</a>
    <a href="collections.html">COLLECTIONS</a>
    <a href="cart.html">CART <span class="cart-count">0</span></a>
  </nav>
  <a href="https://wa.me/919892027604?text=Hello%20House%20of%20Madhu%20Das%20Gupta,%20I'd%20like%20to%20book%20a%20consultation."
     class="top-btn" target="_blank" rel="noopener">
    <i class="fab fa-whatsapp"></i> BOOK CONSULTATION
  </a>
</header>

<section class="checkout-page">

  <h1 class="cart-title">Checkout</h1>
  <p class="checkout-intro">Share your details and we’ll open WhatsApp with your order enquiry. No payment gateway — bespoke orders are confirmed personally.</p>

  <div class="checkout-layout">

    <form id="checkout-form" class="checkout-form" novalidate>
      <label for="checkout-name">Full Name</label>
      <input id="checkout-name" name="name" type="text" required placeholder="Your name" autocomplete="name">

      <label for="checkout-phone">Phone Number</label>
      <input id="checkout-phone" name="phone" type="tel" required placeholder="+91 …" autocomplete="tel">

      <label for="checkout-notes">Notes (optional)</label>
      <textarea id="checkout-notes" name="notes" rows="4" placeholder="Occasion, preferred dates, measurements, or questions…"></textarea>

      <button type="submit" class="gold-btn checkout-wa-btn">
        <i class="fab fa-whatsapp"></i> SEND ENQUIRY ON WHATSAPP
      </button>
    </form>

    <div id="checkout-summary" class="checkout-summary-card">
      <!-- filled by shop.js -->
    </div>

  </div>

</section>

<a href="https://wa.me/919892027604" class="whatsapp-float" target="_blank" rel="noopener">💬</a>
<script src="products.js"></script>
<script src="shop.js"></script>
</body>
